; DT Medix OPcache settings.
; Mounted into the php containers as zz-opcache.ini (loads after the baked
; 99-dtmedix.ini, so these values win).
; validate_timestamps=1 re-checks changed files, which is safe for development;
; for production builds consider baking opcache.validate_timestamps=0.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
