# Local and staging stack: nginx, php-fpm (with Chromium), MySQL 8, Redis,
# queue worker, scheduler and Reverb. Copy .env.example to .env first.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on: [mysql, redis]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, reverb]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dtmedix}
      MYSQL_USER: ${DB_USERNAME:-dtmedix}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --max-time=3600
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on: [mysql, redis]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on: [mysql, redis]

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on: [redis]

volumes:
  mysql-data:
  redis-data:
